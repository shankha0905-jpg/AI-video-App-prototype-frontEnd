<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator prototype 1</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f5fa;
            overflow: hidden;
        }

        /* NAVBAR */
        header {
            height: 70px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;

            background: rgba(65, 105, 225, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;

            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #login,
        #signup {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        #login:hover,
        #signup:hover {
            background: #e8edff;
            transform: translateY(-2px);
        }

        .ligthmood {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        /* MAIN LAYOUT */
        .container {
            display: flex;
            height: 100vh;
            padding-top: 70px;
        }

        /* SIDEBAR */
        .Area {
            width: 250px;
            min-width: 250px;
            height: calc(100vh - 70px);

            background: white;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px 10px;
            overflow-y: auto;

            position: fixed;
            top: 70px;
            left: 0;

            border-right: 1px solid #e5e7eb;
        }

        .newProject,
        .ProjectHistroy {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;

            border: none;
            border-radius: 10px;

            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .newProject {
            background: royalblue;
            color: white;
            font-weight: 600;
        }

        .newProject:hover {
            background: #244dcc;
        }

        .ProjectHistroy {
            background: #f3f5fa;
            color: #333;
        }

        .ProjectHistroy:hover {
            background: #e6eaff;
        }

        /* PROJECT DETAILS */
        .ProjectDetails {
            width: 100%;
            flex: 1;
            min-height: 200px;

            background: #f8f9fc;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 15px;
            margin-top: 10px;
        }

        .ProjectDetails h4 {
            color: #444;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .details {
            width: 100%;
            overflow-y: scroll;
        }

        /* MAIN WORKSPACE */
        .main-workspace {
            flex: 1;
            min-width: 0;
            height: calc(100vh - 70px);

            margin-left: 250px;
            padding: 20px;

            display: flex;
        }

        .input-video {
            width: 100%;
            height: 100%;

            background: white;
            border-radius: 15px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .input-video-dark {
            width: 100%;
            height: 100%;
            background-color: gray;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border-top: 1px solid white;
            border-left: 1px solid white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* VIDEO AREA */
        .video {
            flex: 1;
            min-height: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .video h1 {
            color: #a0a5b1;
            font-size: 25px;
            text-align: center;
        }

        /* INPUT AREA */
        .input {
            width: 100%;
            padding: 20px;

            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            gap: 12px;

            background: white;
        }

        .input input {
            margin-bottom: 10px;
        }

        .input-dark {
            width: 100%;
            padding: 20px;

            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            gap: 12px;

            background-color: transparent;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border-top: 1px solid white;
            border-left: 1px solid white;
        }

        textarea {
            resize: none;

            width: 80%;
            max-width: 800px;
            height: 100px;

            padding: 15px;

            border: 1px solid #dce1ed;
            border-radius: 12px;

            background: #f8f9fc;
            outline: none;

            font-size: 15px;
            line-height: 1.5;

            transition: 0.2s;
        }

        textarea:focus {
            border-color: royalblue;
            box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.12);
        }

        .submit {
            padding: 15px 25px;
            height: 48px;

            background: linear-gradient(135deg, royalblue, #6495ed);
            color: white;

            border: none;
            border-radius: 10px;

            font-weight: bold;
            cursor: pointer;

            transition: 0.2s;
        }

        .submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(65, 105, 225, 0.3);
        }

        .projectname {
            width: 800px;
            padding: 10px;
            border-radius: 10px;
            background-color: whitesmoke;
            border: none;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 700px) {

            header {
                padding: 0 12px;
            }

            .Area {
                width: 180px;
                min-width: 180px;
            }

            .main-workspace {
                margin-left: 180px;
                padding: 10px;
            }

            .video h1 {
                font-size: 18px;
            }

            .input {
                padding: 10px;
                gap: 7px;
            }

            textarea {
                width: 100%;
                height: 85px;
                font-size: 13px;
            }

            .submit {
                padding: 12px 15px;
            }
        }

        @media (max-width: 450px) {
            .Area {
                width: 140px;
                min-width: 140px;
            }

            .main-workspace {
                margin-left: 140px;
            }

            .ProjectDetails {
                padding: 8px;
            }

            .newProject,
            .ProjectHistroy {
                font-size: 11px;
                padding: 10px 5px;
            }

            #login,
            #signup {
                padding: 8px;
                font-size: 11px;
            }
        }

        /* DarkMood */
        .DarkMood {
            background-color: black;
        }

        .Start {
            margin-left: 650px;
        }

        #lang {
            padding: 10px;
            border-radius: 10px;
            /* background-color: transparent; */
            border: none;
        }

        .projectDetailsinnerBox {
            width: 200px;
            min-height: 30px;
            background-color: whitesmoke;
            border: none;
            border-radius: 10px;
            margin-bottom: 5px;
            padding: 10px;
        }

        .delbtnpro {
            border: none;
            text-decoration: dashed;
            background-color: transparent;
            margin-right: 5px;
            cursor: pointer;
        }

        .projectName{
            margin-top: 30px;
            margin-left: 10px;
            /* font-size: 12px; */
            font-family:'Courier New', Courier, monospace;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>

        <div class="LogoBox">
            <img class="logo"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQquZVfbCsiUAAY6Anrv8BuxQ1rHWNxp_mZ-AOhVZwwhw&s=10"
                alt="Logo">
        </div>

        <div class="nav-buttons">
            <button id="login">Login</button>
            <button id="signup">SignUp</button>
            <select name="" id="lang">
                <option value="English">English(Default)</option>
                <option value="Hindi">Hindi</option>
            </select>
            <button class="ligthmood">🌙</button>
        </div>

    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- SIDEBAR -->
        <aside class="Area" id="sideBAr">

            <button class="newProject">
                + Create new project
            </button>

            <button class="ProjectHistroy">
                Project History ⬇
            </button>

            <div class="ProjectDetails" style="display: none;">

                <h4>Project Details</h4>

                <div class="details">
                    <!-- Project details -->
                </div>

            </div>

        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="main-workspace">

            <div class="input-video">

                <!-- VIDEO DISPLAY -->

                <h2 class="projectName"></h2>

                <div class="video">

                    <h1 class="text">No Videos Created Yet.</h1>

                </div>

                <!-- PROMPT INPUT -->
                <div style="border: none;" class="input">
                    <form action="" id="formInput">
                        <input type="text" placeholder="Project Name:" class="projectname">

                        <textarea placeholder="Describe the video you want to create..."></textarea>
                    </form>
                </div>
            </div>
        </main>

    </div>

    <script>
        let ligthmoodbtn = document.querySelector(".ligthmood");
        let body = document.querySelector("body");
        let input_video = document.querySelector(".input-video");
        let input = document.querySelector(".input");
        let sideBAr = document.getElementById("sideBAr");
        let newProjectbtn = document.querySelector(".newProject");
        let ProjectDetails = document.querySelector(".ProjectDetails");
        let text = document.querySelector(".text");
        let ProjectHistroy = document.querySelector(".ProjectHistroy");
        let ProjectDetailsBox = document.querySelector(".ProjectDetails");
        let formInput = document.getElementById("formInput");
        let projectname = document.querySelector(".projectname");
        let textarea = document.querySelector("textarea");
        let details = document.querySelector(".details");

        let isdarkorligth = true;
        let isHide = true;
        let count = 0;

        //Dark Themes.
        ligthmoodbtn.addEventListener("click", () => {
            //change symbol of button;
            if (isdarkorligth == true) {
                ligthmoodbtn.innerHTML = "☀️"
                body.classList.add("DarkMood");
                input.classList.add("input-dark");
                input_video.classList.add("input-video-dark");
                sideBAr.style.backgroundColor = "gray";
                newProjectbtn.style.backgroundColor = "black";
                ProjectDetails.style.backgroundColor = "lightgray";
                text.style.color = "white"
                isdarkorligth = false;
            } else {
                ligthmoodbtn.innerHTML = "🌙";
                body.classList.remove("DarkMood");
                input.classList.remove("input-dark");
                input_video.classList.remove("input-video-dark");
                sideBAr.style.backgroundColor = "white";
                newProjectbtn.style.backgroundColor = "royalblue";
                ProjectDetails.style.backgroundColor = "whitesmoke";
                text.style.color = "#a0a5b1"
                isdarkorligth = true
            }
        });

        //hide project bar;
        ProjectHistroy.addEventListener("click", () => {
            if (isHide) {
                ProjectDetailsBox.style.display = "flex";
                ProjectHistroy.innerHTML = "Project History ⬆"
                isHide = false;
            } else {
                ProjectDetailsBox.style.display = "none";
                ProjectHistroy.innerHTML = "Project History ⬇"
                isHide = true;
            }
        });

        formInput.addEventListener("keydown", (Event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                if (projectname.value === "" || textarea.value === "") {
                    alert("Project name and prompt is needed.")
                } else {
                    const projectDetailsinnerBox = document.createElement("div");
                    projectDetailsinnerBox.classList.add("projectDetailsinnerBox");
                    projectDetailsinnerBox.style.display = "flex";
                    projectDetailsinnerBox.style.justifyContent = "space-between";
                    projectDetailsinnerBox.style.alignItems = "center";
                    details.appendChild(projectDetailsinnerBox);

                    const proName = document.createElement("p");
                    count += 1;
                    proName.innerHTML = `${count} ${projectname.value}`;
                    proName.style.fontSize="11px";
                    projectDetailsinnerBox.appendChild(proName);

                    const delbtn = document.createElement("button");
                    delbtn.innerHTML = "Delete"
                    delbtn.classList.add("delbtnpro");
                    projectDetailsinnerBox.appendChild(delbtn);

                    // Attach event listener to the delete button
                    delbtn.addEventListener("click", () => {
                        // Find the closest parent div with a specific class or selector
                        const targetDiv = delbtn.closest(".projectDetailsinnerBox");

                        if (targetDiv) {
                            targetDiv.remove(); // Removes only that specific div
                        }
                    });
                }
            }
        })
    </script>
</body>

</html>
